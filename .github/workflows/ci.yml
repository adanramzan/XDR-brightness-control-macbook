name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test brightness policy
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash XDRBrightness/build.sh
      - name: Verify architectures and signature
        run: |
          lipo -verify_arch arm64 x86_64 "dist/XDR Brightness.app/Contents/MacOS/XDRBrightness"
          codesign --verify --deep --strict "dist/XDR Brightness.app"
