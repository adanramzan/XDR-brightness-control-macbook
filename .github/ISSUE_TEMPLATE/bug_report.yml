name: Bug report
description: Report a reproducible brightness or keyboard issue.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Mac model and macOS version
      placeholder: MacBookPro18,2; macOS 27.0.1
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility permission enabled for this installed app?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
      description: Include other display/brightness apps running. Do not include private logs or personal information. Distinguish estimated nits from measured luminance.
    validations:
      required: true
